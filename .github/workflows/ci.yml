name: CI

# Both production sites (Vercel + Cloudflare Pages) build straight from `main`,
# so a broken commit reaches users without any gate. This workflow is that gate:
# it validates the question bank and type-checks + builds the app on every push
# and pull request.
#
# Keep this in sync with the checklist in RELEASE.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate question bank
        run: npm run validate:questions

      - name: Type-check and build
        run: npm run build
